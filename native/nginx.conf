# =============================================================================
# NMS - Nginx Reverse Proxy Configuration
# =============================================================================
# Copy to: /etc/nginx/sites-available/nms.conf (Debian/Ubuntu)
#       or: /etc/nginx/conf.d/nms.conf (CentOS/RHEL)
# Then:  sudo systemctl reload nginx
# =============================================================================

upstream nms_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # Replace with your domain, e.g., nms.example.com

    client_max_body_size 50M;
    client_body_timeout 60s;

    # Main application
    location / {
        proxy_pass http://nms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # WebSocket endpoint (explicit upgrade path)
    location /ws {
        proxy_pass http://nms_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # API docs
    location /docs {
        proxy_pass http://nms_backend/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://nms_backend/redoc;
        proxy_set_header Host $host;
    }

    # Static files (serve directly by Nginx for better performance)
    location /static {
        alias /opt/nms/frontend;
        expires 1d;
        add_header Cache-Control "public";
    }
}

